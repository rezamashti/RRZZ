services:
  - type: web
    name: god-photo-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: CHANNEL_ID
        value: "@zrzrgod"
      - key: POST_INTERVAL_SECONDS
        value: "300"
      - key: MAX_PHOTOS_PER_CYCLE
        value: "5"
      - key: HF_HOME
        value: /app/data/huggingface
      - key: TORCH_HOME
        value: /app/data/torch
      - key: MIN_STYLE_SIMILARITY
        value: "0.12"
      - key: MIN_PROFILE_SCORE
        value: "-0.10"
      - key: DUPLICATE_THRESHOLD
        value: "0.985"
